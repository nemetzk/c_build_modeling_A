<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Board Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="toolbar" role="toolbar" aria-label="Card controls">
        <button id="add-card-btn" type="button">Add Card</button>
        <label for="card-color">Card color</label>
        <input id="card-color" type="color" value="#f9e65a" />
      </header>

      <section
        id="board"
        class="board"
        aria-label="Connectable sticky notes board"
      ></section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
